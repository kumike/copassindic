<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подсчёт паролей</title>
<style>
body { font-family: Arial, sans-serif; background: #111; color: #eee; padding: 20px; }
.container { max-width: 700px; margin: auto; text-align: center; }
input { margin: 20px 0; }
.progress { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; }
.progress-bar { height: 100%; width: 0%; background: #4caf50; }
.note { font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<div class="container">
    <h1>Подсчёт паролей в словаре</h1>
    <input type="file" id="fileInput" accept=".txt,.log,.gz,.zip">
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <p id="status">Ожидание файла...</p>
    <h2 id="result"></h2>
    <p class="note">txt / gz / zip • безопасный подсчёт • без зависаний</p>
</div>
<!-- Убираем pako и jszip, они не предназначены для потоковой обработки гигантских файлов в браузере -->
<!-- Подключаем современный zip.js, который умеет работать с потоками -->
<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.52/dist/zip.min.js"></script>

<script>
const input = document.getElementById('fileInput');
const result = document.getElementById('result');
const status = document.getElementById('status');
const progressBar = document.getElementById('progressBar');

input.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    result.innerText = '';
    progressBar.style.width = '0%';
    status.innerText = 'Запуск...';

    try {
        if (file.name.endsWith('.gz')) {
            await processGzip(file);
        } else if (file.name.endsWith('.zip')) {
            await processZip(file);
        } else {
            await processText(file);
        }
    } catch (err) {
        console.error(err);
        status.innerText = 'Ошибка: ' + err.message;
    }
});

// Универсальная функция подсчета переносов строк в Uint8Array (байтах)
// Это намного быстрее и экономнее по памяти, чем декодирование в строку
function countLinesInChunk(chunk) {
    let lines = 0;
    for (let i = 0; i < chunk.length; i++) {
        if (chunk[i] === 10) { // 10 - это ASCII код символа '\n'
            lines++;
        }
    }
    return lines;
}

async function processText(file) {
    let totalLines = 0;
    let lastByte = 0;
    let bytesRead = 0;

    // Читаем файл как поток сырых байтов (Uint8Array), без загрузки в память целиком
    const reader = file.stream().getReader();

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        totalLines += countLinesInChunk(value);
        if (value.length > 0) lastByte = value[value.length - 1];
        bytesRead += value.length;

        // Обновляем прогресс и даем браузеру "передохнуть", чтобы UI не завис
        if (bytesRead % (1024 * 1024) < value.length) {
            const pct = Math.min(100, Math.floor((bytesRead / file.size) * 100));
            progressBar.style.width = pct + '%';
            status.innerText = 'Обработка: ' + pct + '%';
            await new Promise(r => setTimeout(r, 0));
        }
    }

    // Если файл не заканчивается переносом строки, считаем последнюю строку
    if (lastByte !== 10 && lastByte !== 0) totalLines++;

    progressBar.style.width = '100%';
    status.innerText = 'Готово';
    result.innerText = 'Количество паролей: ' + totalLines.toLocaleString();
}

async function processGzip(file) {
    let totalLines = 0;
    let lastByte = 0;
    let bytesRead = 0;

    // Проверяем поддержку нативного API распаковки (есть во всех современных браузерах)
    if (typeof DecompressionStream === 'undefined') {
        throw new Error('Ваш браузер не поддерживает потоковую распаковку DecompressionStream. Обновите браузер.');
    }

    // Создаем промежуточный поток для отслеживания прогресса чтения исходного файла
    const progressStream = new TransformStream({
        transform(chunk, controller) {
            bytesRead += chunk.length;
            const pct = Math.min(100, Math.floor((bytesRead / file.size) * 100));
            progressBar.style.width = pct + '%';
            status.innerText = 'Распаковка и обработка: ' + pct + '%';
            controller.enqueue(chunk);
        }
    });

    // Цепочка потоков: Файл -> Отслеживание прогресса -> Нативная распаковка GZIP -> Чтение
    const reader = file.stream()
        .pipeThrough(progressStream)
        .pipeThrough(new DecompressionStream('gzip'))
        .getReader();

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        totalLines += countLinesInChunk(value);
        if (value.length > 0) lastByte = value[value.length - 1];

        // Периодически уступаем управление главному потоку
        if (bytesRead % (1024 * 1024) < value.length) {
            await new Promise(r => setTimeout(r, 0));
        }
    }

    if (lastByte !== 10 && lastByte !== 0) totalLines++;

    progressBar.style.width = '100%';
    status.innerText = 'Готово';
    result.innerText = 'Количество паролей: ' + totalLines.toLocaleString();
}

async function processZip(file) {
    let totalLines = 0;
    status.innerText = 'Чтение структуры архива...';
    
    // Отключаем веб-воркеры для простоты отслеживания прогресса в одном потоке
    // (для 10 ГБ это надежнее с точки зрения управления памятью в данном контексте)
    zip.configure({ useWebWorkers: false });

    const zipReader = new zip.ZipReader(new zip.BlobReader(file));
    const entries = await zipReader.getEntries();
    
    const fileEntries = entries.filter(e => !e.directory);
    if (fileEntries.length === 0) {
        throw new Error('В архиве нет файлов');
    }

    // Кастомный "писатель", который обрабатывает данные чанками, не загружая их в память
    class LineCountingWriter {
        constructor() {
            this.totalLines = 0;
            this.lastByte = 0;
        }
        init() { return Promise.resolve(); }
        
        writeUint8Array(chunk) {
            this.totalLines += countLinesInChunk(chunk);
            if (chunk.length > 0) {
                this.lastByte = chunk[chunk.length - 1];
            }
            return Promise.resolve();
        }
        
        getData() {
            if (this.lastByte !== 10 && this.lastByte !== 0) {
                this.totalLines++;
            }
            return Promise.resolve(this.totalLines);
        }
    }

    for (let i = 0; i < fileEntries.length; i++) {
        const entry = fileEntries[i];
        status.innerText = `Обработка файла ${i + 1}/${fileEntries.length}: ${entry.filename}`;
        
        // Передаем наш кастомный писатель. zip.js будет скармливать ему данные небольшими кусками.
        const lines = await entry.getData(new LineCountingWriter());
        totalLines += lines;

        const pct = Math.min(100, Math.floor(((i + 1) / fileEntries.length) * 100));
        progressBar.style.width = pct + '%';
        
        // Даём браузеру обновить UI
        await new Promise(r => setTimeout(r, 0));
    }

    await zipReader.close();

    progressBar.style.width = '100%';
    status.innerText = 'Готово';
    result.innerText = 'Количество паролей: ' + totalLines.toLocaleString();
}
</script>
</body>
</html>
